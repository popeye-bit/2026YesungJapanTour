<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>2026藝聲日巡行程表</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#fff;}
.muted{color:#6b7280;}
</style>
</head>

<body class="text-black">

<div class="max-w-3xl mx-auto p-4">

<h1 class="text-lg font-semibold mb-2">
2026藝聲日巡｜大阪、名古屋行程表
</h1>

<div id="status" class="text-xs muted mb-3">初始化中...</div>

<div id="dayTabs" class="flex gap-2 mb-3 overflow-x-auto"></div>
<button onclick="addDay()" class="mb-3 px-3 py-1 border">+ 新增天數</button>

<div id="planner" class="border rounded-xl p-3"></div>

</div>

<script>

/* =========================
   🔑 SUPABASE 設定（必填）
========================= */
const SUPABASE_URL = "https://bfevhezngiswpgpajrst.supabase.co/rest/v1/";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmZXZoZXpuZ2lzd3BncGFqcnN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NTMzOTEsImV4cCI6MjA5MzIyOTM5MX0.X8afOg08mh_eg_dUQh665rfzWTIGR4eFxoYAU1QlC5Q";

/* =========================
   📦 資料
========================= */
let data = { days:[{name:"Day 1",items:[]}] };
let currentDay = 0;

let syncTimer;

/* =========================
   🌐 狀態顯示
========================= */
function status(t){
  document.getElementById("status").innerText = "同步：" + t;
}

/* =========================
   ☁️ 讀雲端
========================= */
async function loadCloud(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/planner?id=eq.yesung2026`,{
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:"Bearer "+SUPABASE_KEY
      }
    });

    const json = await res.json();

    if(json.length && json[0].data){
      data = json[0].data;
      status("已載入雲端");
    }else{
      await saveCloud();
    }

  }catch(e){
    status("離線模式");
  }
}

/* =========================
   ☁️ 存雲端
========================= */
async function saveCloud(){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/planner?id=eq.yesung2026`,{
      method:"PATCH",
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:"Bearer "+SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({data})
    });

    status("已同步");

  }catch(e){
    status("同步失敗");
  }
}

/* =========================
   💾 save（重點優化版）
========================= */
function save(){

  // 本機先存（不卡）
  localStorage.setItem("planner", JSON.stringify(data));

  status("等待同步...");

  clearTimeout(syncTimer);

  syncTimer = setTimeout(()=>{
    saveCloud();
  }, 1200);
}

/* =========================
   🧭 Tabs
========================= */
function renderTabs(){
  const el=document.getElementById("dayTabs");
  el.innerHTML="";

  data.days.forEach((d,i)=>{
    const btn=document.createElement("button");
    btn.textContent=d.name;
    btn.className=`px-3 py-1 border text-sm ${i===currentDay?'bg-black text-white':''}`;
    btn.onclick=()=>{currentDay=i;render();}
    el.appendChild(btn);
  });
}

/* =========================
   📱 render
========================= */
function render(){
  renderTabs();

  const box=document.getElementById("planner");
  box.innerHTML="";

  data.days[currentDay].items.forEach((item,i)=>{

    const div=document.createElement("div");
    div.className="flex gap-3 p-3 border-b";

    const transport = item.transport ? `<div class="text-xs muted">🚗 ${item.transport}</div>` : "";
    const note = item.note ? `<div class="text-xs muted">${item.note}</div>` : "";
    const nav = item.loc ? `<button onclick="openMap('${item.loc}')" class="text-xs underline">導航</button>` : "";

    div.innerHTML=`
      <div class="w-14 h-14 border flex items-center justify-center text-xs">
        ${item.time||"--:--"}
      </div>

      <div class="flex-1">
        <div class="font-medium">${item.title||""}</div>
        ${transport}
        ${note}
        ${nav}
      </div>

      <div class="text-xs flex flex-col">
        <button onclick="move(${i},-1)">↑</button>
        <button onclick="move(${i},1)">↓</button>
        <button onclick="edit(${i})">編輯</button>
        <button onclick="del(${i})">刪</button>
      </div>
    `;

    box.appendChild(div);
  });

  const btn=document.createElement("button");
  btn.className="w-full mt-3 border py-2";
  btn.textContent="+ 新增行程";
  btn.onclick=add;
  box.appendChild(btn);
}

/* =========================
   ➕ 新增天數
========================= */
function addDay(){
  data.days.push({name:`Day ${data.days.length+1}`,items:[]});
  currentDay=data.days.length-1;
  save();
}

/* =========================
   ➕ 新增行程
========================= */
function add(){
  const time=prompt("時間");
  const title=prompt("景點");
  const loc=prompt("地點");
  const transport=prompt("前往方式");
  const note=prompt("備註");

  data.days[currentDay].items.push({time,title,loc,transport,note});
  save();
}

/* =========================
   ✏️ 編輯
========================= */
function edit(i){
  const it=data.days[currentDay].items[i];

  it.time=prompt("時間",it.time);
  it.title=prompt("景點",it.title);
  it.loc=prompt("地點",it.loc);
  it.transport=prompt("前往方式",it.transport);
  it.note=prompt("備註",it.note);

  save();
}

/* =========================
   ❌ 刪除
========================= */
function del(i){
  data.days[currentDay].items.splice(i,1);
  save();
}

/* =========================
   🔼🔽 排序
========================= */
function move(i,d){
  const arr=data.days[currentDay].items;
  const ni=i+d;
  if(ni<0||ni>=arr.length)return;

  [arr[i],arr[ni]]=[arr[ni],arr[i]];
  save();
}

/* =========================
   🗺 Google Maps
========================= */
function openMap(q){
  window.open(`https://maps.google.com/?q=${encodeURIComponent(q)}`);
}

/* =========================
   🚀 初始化
========================= */
async function init(){

  const local = localStorage.getItem("planner");
  if(local) data = JSON.parse(local);

  await loadCloud();
  render();
}

init();

</script>

</body>
</html>
