<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026藝聲日巡行程表</title>

  <!-- PWA -->
  <link rel="manifest" id="manifest">
  <meta name="theme-color" content="#000000">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <!-- Firebase (Cloud Sync) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    body { background:#fff; }
    .card { touch-action: manipulation; }
    .muted { color:#6b7280; }
  </style>
</head>

<body class="text-black">

<div class="max-w-3xl mx-auto p-4">

  <div class="flex justify-between items-center mb-3">
    <h1 class="text-lg font-semibold">2026藝聲日巡｜大阪、名古屋行程表</h1>
  </div>

  <div id="dayTabs" class="flex gap-2 overflow-x-auto mb-3"></div>
  <button onclick="addDay()" class="mb-3 px-3 py-1 border">+ 新增天數</button>

  <div id="planner" class="border rounded-xl p-3"></div>

  <div class="flex gap-2 mt-4">
    <button onclick="exportImage()" class="flex-1 border py-2">匯出當天</button>
    <button onclick="exportAll()" class="flex-1 border py-2">匯出全部</button>
  </div>

</div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 hidden items-center justify-center bg-black/40 p-4">
  <div class="bg-white w-full max-w-sm p-4 border space-y-2">

    <input id="mLoc" placeholder="地點（Google Maps 用）" class="w-full p-2 border" />
    <input id="mTime" placeholder="時間" class="w-full p-2 border" />
    <input id="mTitle" placeholder="景點" class="w-full p-2 border" />
    <input id="mTransport" placeholder="前往方式" class="w-full p-2 border" />
    <input id="mNote" placeholder="備註" class="w-full p-2 border" />

    <div class="flex gap-2">
      <button onclick="saveModal()" class="flex-1 border py-2">儲存</button>
      <button onclick="closeModal()" class="flex-1 border py-2">取消</button>
    </div>

  </div>
</div>

<script>
// ---------- Cloud Sync (Firebase) ----------
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("planner").doc("yesung2026");

// ---------- Data ----------
let data = { days:[{name:'Day 1',items:[]}] };
let currentDay=0;
let editIndex=null;

async function loadCloud(){
  const doc = await docRef.get();
  if(doc.exists){
    data = doc.data();
    render();
  }
}

function syncCloud(){
  docRef.set(data);
}

function save(){
  localStorage.setItem('planner',JSON.stringify(data));
  syncCloud();
}

function renderTabs(){
  const el=document.getElementById('dayTabs');
  el.innerHTML='';

  data.days.forEach((d,i)=>{
    const input=document.createElement('input');
    input.value=d.name;
    input.className=`px-2 py-1 border text-sm ${i===currentDay?'bg-black text-white':'bg-white'}`;

    input.onchange=e=>{d.name=e.target.value;save();};
    input.onclick=()=>{currentDay=i;render();};

    el.appendChild(input);
  });
}

function render(){
  renderTabs();

  const box=document.getElementById('planner');
  box.innerHTML='';

  const list=document.createElement('div');
  list.id='list';

  data.days[currentDay].items.forEach((item,i)=>{
    const div=document.createElement('div');
    div.className='card flex gap-3 p-3 border-b';
    div.dataset.id=i;

    div.innerHTML=`
      <div class="w-14 h-14 border flex items-center justify-center text-xs font-semibold">
        ${item.time || '--:--'}
      </div>

      <div class="flex-1">
        <div class="font-semibold text-sm">${item.title||''}</div>
        <div class="text-xs muted">🚗 ${item.transport||''}</div>
        <div class="text-xs muted">${item.note||''}</div>
        <button onclick="openMap('${item.loc||item.title}')" class="text-xs underline">導航</button>
      </div>

      <div class="text-xs flex flex-col gap-1">
        <button onclick="openModal(${i})">編輯</button>
        <button onclick="deleteItem(${i})">刪</button>
      </div>
    `;

    list.appendChild(div);
  });

  box.appendChild(list);

  Sortable.create(list,{
    animation:150,
    onEnd:function(evt){
      const arr=data.days[currentDay].items;
      const moved=arr.splice(evt.oldIndex,1)[0];
      arr.splice(evt.newIndex,0,moved);
      save();render();
    }
  });

  const add=document.createElement('button');
  add.className='w-full mt-3 border py-2';
  add.textContent='+ 新增行程';
  add.onclick=()=>openModal();
  box.appendChild(add);
}

function openMap(q){
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`);
}

function addDay(){
  data.days.push({name:`Day ${data.days.length+1}`,items:[]});
  save();render();
}

function deleteItem(i){
  data.days[currentDay].items.splice(i,1);
  save();render();
}

function openModal(i=null){
  editIndex=i;
  modal.classList.remove('hidden');

  const it=data.days[currentDay].items[i]||{};
  mLoc.value=it.loc||'';
  mTime.value=it.time||'';
  mTitle.value=it.title||'';
  mTransport.value=it.transport||'';
  mNote.value=it.note||'';
}

function closeModal(){modal.classList.add('hidden');}

function saveModal(){
  const obj={
    loc:mLoc.value,
    time:mTime.value,
    title:mTitle.value,
    transport:mTransport.value,
    note:mNote.value
  };

  if(editIndex!==null) data.days[currentDay].items[editIndex]=obj;
  else data.days[currentDay].items.push(obj);

  save();closeModal();render();
}

function exportImage(){
  html2canvas(document.getElementById('planner')).then(c=>{
    const a=document.createElement('a');
    a.href=c.toDataURL();a.download='day.png';a.click();
  });
}

function exportAll(){
  html2canvas(document.body).then(c=>{
    const a=document.createElement('a');
    a.href=c.toDataURL();a.download='trip.png';a.click();
  });
}

loadCloud();
render();
</script>

</body>
</html>
