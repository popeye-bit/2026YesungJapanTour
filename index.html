<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026藝聲日巡｜大阪、名古屋行程表</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#fff;}
.muted{color:#6b7280;}
</style>
</head>

<body class="text-black">

<div class="max-w-3xl mx-auto p-4">

<h1 class="text-lg font-semibold mb-3">
2026藝聲日巡｜大阪、名古屋行程表
</h1>

<div id="status" class="text-xs muted mb-2">同步中...</div>

<div id="dayTabs" class="flex gap-2 mb-3 overflow-x-auto"></div>
<button onclick="addDay()" class="mb-3 px-3 py-1 border">+ 新增天數</button>

<div id="planner" class="border rounded-xl p-3"></div>

</div>

<script>

// ====== 🔑 填你的 Supabase ======
const SUPABASE_URL = "https://bfevhezngiswpgpajrst.supabase.co";
const SUPABASE_KEY = "process.env.SUPABASE_KEY";

// ====== DATA ======
let data = { days:[{name:'Day 1',items:[]}] };
let currentDay = 0;

// ====== CLOUD LOAD ======
async function loadCloud(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/planner?id=eq.yesung2026`,{
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:"Bearer "+SUPABASE_KEY
      }
    });

    const json = await res.json();
    if(json.length && json[0].data){
      data = json[0].data;
      status("已同步（雲端）");
    }else{
      await saveCloud();
    }
  }catch(e){
    status("離線模式");
  }
}

// ====== CLOUD SAVE ======
async function saveCloud(){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/planner?id=eq.yesung2026`,{
      method:"PATCH",
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:"Bearer "+SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({data})
    });
    status("已同步");
  }catch(e){
    status("同步失敗");
  }
}

function status(t){
  document.getElementById("status").innerText = "同步狀態："+t;
}

// ====== SAVE ======
function save(){
  saveCloud();
  render();
}

// ====== UI ======
function renderTabs(){
  const el=document.getElementById("dayTabs");
  el.innerHTML="";

  data.days.forEach((d,i)=>{
    const btn=document.createElement("button");
    btn.textContent=d.name;
    btn.className=`px-3 py-1 border ${i===currentDay?'bg-black text-white':''}`;
    btn.onclick=()=>{currentDay=i;render();}
    el.appendChild(btn);
  });
}

function render(){
  renderTabs();

  const box=document.getElementById("planner");
  box.innerHTML="";

  data.days[currentDay].items.forEach((item,i)=>{

    const div=document.createElement("div");
    div.className="flex gap-3 p-3 border-b";

    const transport = item.transport ? `<div class="text-xs muted">🚗 ${item.transport}</div>` : "";
    const note = item.note ? `<div class="text-xs muted">${item.note}</div>` : "";
    const nav = item.loc ? `<button onclick="openMap('${item.loc}')" class="text-xs underline">導航</button>` : "";

    div.innerHTML=`
      <div class="w-14 h-14 border flex items-center justify-center text-xs">
        ${item.time||'--:--'}
      </div>

      <div class="flex-1">
        ${item.title||''}
        ${transport}
        ${note}
        ${nav}
      </div>

      <div class="text-xs">
        <button onclick="move(${i},-1)">↑</button>
        <button onclick="move(${i},1)">↓</button>
        <button onclick="edit(${i})">編輯</button>
        <button onclick="del(${i})">刪</button>
      </div>
    `;

    box.appendChild(div);
  });

  const btn=document.createElement("button");
  btn.className="w-full mt-3 border py-2";
  btn.textContent="+ 新增行程";
  btn.onclick=add;
  box.appendChild(btn);
}

// ====== ACTION ======
function addDay(){
  data.days.push({name:`Day ${data.days.length+1}`,items:[]});
  currentDay=data.days.length-1;
  save();
}

function add(){
  const time=prompt("時間");
  const title=prompt("景點");
  const loc=prompt("地點");
  const transport=prompt("前往方式");
  const note=prompt("備註");

  data.days[currentDay].items.push({time,title,loc,transport,note});
  save();
}

function edit(i){
  const it=data.days[currentDay].items[i];

  it.time=prompt("時間",it.time);
  it.title=prompt("景點",it.title);
  it.loc=prompt("地點",it.loc);
  it.transport=prompt("前往方式",it.transport);
  it.note=prompt("備註",it.note);

  save();
}

function del(i){
  data.days[currentDay].items.splice(i,1);
  save();
}

function move(i,d){
  const arr=data.days[currentDay].items;
  const ni=i+d;
  if(ni<0||ni>=arr.length)return;
  [arr[i],arr[ni]]=[arr[ni],arr[i]];
  save();
}

function openMap(q){
  window.open(`https://maps.google.com/?q=${encodeURIComponent(q)}`);
}

// ====== INIT ======
async function init(){
  await loadCloud();
  render();
}

init();

</script>

</body>
</html>
